server:
  port: ${PORT:0}

spring:
  application:
    name: report-service
  security:
    oauth2:
      client:
        registration:
          test-client1:
            provider: spring
            client-name: test-client1
            client-id: generated
            client-secret: generated
            authorization-grant-type: client_credentials
            scope:
              - openid
              - profile
        provider:
          spring:
            issuer-uri: ${AUTH_SERVER_ISSUER_URL:http://auth-server:8899}
            token-uri: ${AUTH_SERVER_TOKEN_URL:http://auth-server:8899/oauth2/token}
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_JWK_URL:http://auth-server:8899/oauth2/jwks}

oleap:
  eureka:
    url: ${oleap.srv.protocol}://${spring.security.user.name}:${spring.security.user.password}@${oleap.srv.hostname}:${oleap.srv.port}
    zone: ${oleap.eureka.url}/eureka/
  srv:
    protocol: ${REGISTRY_PROTOCOL:http}
    hostname: ${REGISTRY_HOSTNAME:localhost}
    port: ${REGISTRY_PORT:8761}
  client:
    registration:
      registration-endpoint: ${AUTH_REGISTRATION_URL:http://auth-server:8899/connect/register}
      registration-username:  ${AUTH_REGISTRATION_USERNAME:register-client}
      registration-password: ${AUTH_REGISTRATION_PASSWORD:'{cipher}'}
      token-endpoint: ${AUTH_REGISTRATION_TOKEN_URL:http://auth-server:8899/oauth2/token}
      registration-scopes: ${AUTH_REGISTRATION_SCOPES:client.create}
      grant-types: ${AUTH_REGISTRATION_GRANTTYPE:client_credentials}
      base-url: ${GATEWAY_BASE_URL:http://127.0.0.1:8086}

eureka:
  client:
    instance-info-replication-interval-seconds: 10 # default is 30
    registryFetchIntervalSeconds: 5 # SBA
    service-url:
      defaultZone: ${oleap.eureka.zone} # Must be camelCase
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    health-check-url-path: /actuator/health
    hostname: ${oleap.srv.hostname}
    # Request a lease with a validity of 5 seconds. If until then the
    # lease has not been renewed, it expires and the Eureka server can evict it.
    # Default: 90s
    lease-expiration-duration-in-seconds: 5

    # The cadence of lease renewal, i.e. how often a heartbeat is sent to Eureka server.
    # In this case every 2 seconds. Use this only for development / debugging. In production use the ...
    # Default: 30s
    lease-renewal-interval-in-seconds:    2
    metadata-map:
      config-protocol: http # The protocol used to access the config server
      username: ${spring.security.user.name}
      password: ${spring.security.user.password}
      protocol: ${oleap.srv.protocol}
      zone: ${oleap.eureka.zone}
    non-secure-port-enabled: true
    prefer-ip-address: true
    secure-port-enabled: false
#    statusPageUrl: ${oleap.srv.protocol}://${oleap.srv.hostname}:${server.port}/actuator/info
#    healthCheckUrl: ${oleap.srv.protocol}://${oleap.srv.hostname}:${server.port}/actuator/health
#    homePageUrl: ${oleap.srv.protocol}://${oleap.srv.hostname}:${server.port}/

management:
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  level:
    root: INFO
    io.openleap: DEBUG
#    org.springframework.web: INFO
#    org.springframework.security: TRACE
#    org.springframework.security.oauth2: TRACE