server:
  port: ${PORT:8099}

spring:
  profiles:
   active: ${SPRING_PROFILES_ACTIVE:native}
  application:
    name: openleap-config
  security:
    user:
      password: sa
      name: user
  cloud:
    config:
      server:
        git:
          uri: git@github.com:openleap-io/io.openleap.config-repo.git
          force-pull: true
          search-paths: config
          clone-on-start: true
          username: ${SSH_USERNAME:your_username}
          password: ${SSH_PASSWORD:your_password}
          default-label: main
encrypt:
  keyStore:
    location: classpath:/server.jks
    password: letmein
    alias: mytestkey
    secret: letmein

health:
  config:
    enabled: true

oleap:
  eureka:
    url: http://user:sa@localhost:8761
    zone: ${oleap.eureka.url}/eureka/
  srv:
    protocol: http
    hostname: localhost

eureka:
  client:
    healthcheck:
      enabled: true
    instance-info-replication-interval-seconds: 10 # default is 30
    service-url:
      defaultZone: ${oleap.eureka.zone} # Must be camelCase
  instance:
    hostname: ${oleap.srv.hostname}
    secure-port-enabled: false
    non-secure-port-enabled: true
    metadata-map:
      username: ${spring.security.user.name}
      password: ${spring.security.user.password}
      protocol: ${oleap.srv.protocol}
      zone: ${oleap.eureka.zone}

management:
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  file:
    name: BOOT-CORE-Config.log
    path: "/tmp/oleap"

---
spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:config/
        bootstrap: true
