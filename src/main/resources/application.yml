server:
  port: 8099

spring:
  profiles:
   active: native
  application:
    name: openleap-config
  security:
    user:
      name: user
      password: sa
  cloud:
    config:
      server:
        git:
          uri: git@github.com:openleap-io/io.openleap.config-repo.git
          force-pull: true
          search-paths: config
          clone-on-start: true
          username: your_username
          password: your_password
          default-label: main
encrypt:
  keyStore:
    location: classpath:/server.jks
    password: letmein
    alias: mytestkey
    secret: letmein

health:
  config:
    enabled: true

oleap:
  eureka:
    url: ${oleap.srv.protocol}://${oleap.srv.user.name}:${oleap.srv.user.password}@${oleap.srv.hostname}:${oleap.srv.port}
    zone: ${oleap.eureka.url}/eureka/
  srv:
    protocol: http
    hostname: localhost
    port: 8761
    user:
      name: user
      password: sa

eureka:
  client:
    healthcheck:
      enabled: true
    instance-info-replication-interval-seconds: 10 # default is 30
    service-url:
      defaultZone: ${oleap.eureka.zone} # Must be camelCase
  instance:
    hostname: ${oleap.srv.hostname}
    secure-port-enabled: false
    non-secure-port-enabled: true
    metadata-map:
      username: ${spring.security.user.name}
      password: ${spring.security.user.password}
      protocol: ${oleap.srv.protocol}
      zone: ${oleap.eureka.zone}

management:
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  file:
    name: BOOT-CORE-Config.log
    path: "/tmp/oleap"